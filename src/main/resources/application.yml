spring:
  application:
    name: kidspirehub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: ${DB_DEFAULT_SCHEMA:kidspirehub}
    show-sql: true

  sql:
    init:
      mode: always
      platform: postgresql

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:your-bucket-name}
    accessKey: ${AWS_ACCESS_KEY_ID:your-access-key}
    secretKey: ${AWS_SECRET_ACCESS_KEY:your-secret-key}
    region: ${AWS_REGION:us-east-1}

server:
  port: 8080

security:
  jwt:
    # Base64-encoded secret (default for dev only). Replace in prod via env var SECURITY_JWT_SECRET
    secret: ${SECURITY_JWT_SECRET:Y2hhbmdlX21lX3NlY3JldF9jaGFuZ2VfbWVfc2VjcmV0}
    expirationMs: ${SECURITY_JWT_EXPIRATION_MS:86400000}

feature:
  emailLinkSignin: ${FEATURE_EMAIL_LINK_SIGNIN:false}

